name: Lab contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/contracts.mjs
      - run: node --test tests/predictions-v2-recovery.test.mjs
      - run: node scripts/build-predictions.mjs --check
      - run: node scripts/build-interactions.mjs --check
      - run: node --test tests/interactions-v3-recovery.test.mjs
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/widget-lab-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/interactions-v3-browser.mjs
          node tests/browser-smoke.mjs
          node tests/predictions-v2-recovery-browser.mjs
          node tests/predictions-v2-clock.mjs
          node tests/predictions-v2-visual.mjs
          node tests/predictions-v2-parity.mjs
          node tests/predictions-v2-browser.mjs
          node tests/predictions-v2-published.mjs
          node tests/predictions-v2-stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-browser-smoke
          path: test-results/
