name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Prepare published-site verification
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-save --package-lock=false playwright@1.64.1
      - run: npx playwright install --with-deps chromium

      - name: Verify published predictions
        env:
          LAB_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/predictions-v2-published.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-prediction-check
          path: test-results/published/
